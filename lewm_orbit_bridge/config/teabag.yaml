experiment_name: teabag_overhead_fs3_v1
seed: 3072
dataset_path: ${oc.env:LEWM_DATASET}
split_manifest: ${oc.env:LEWM_SPLITS}
output_dir: ${oc.env:LEWM_OUTPUT_DIR,outputs/lewm/teabag_overhead_fs3_v1}
lewm_root: ${oc.env:LEWM_ROOT,external/le-wm}

img_size: 224
embed_dim: 192
history_size: 3
num_preds: 1

dataset:
  num_steps: ${eval:'${num_preds} + ${history_size}'}
  frameskip: 3
  keys_to_load:
    - pixels
    - action
  keys_to_cache:
    - action

loader:
  batch_size: 32
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true

trainer:
  max_epochs: 100
  max_steps: -1
  devices: auto
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0

optimizer:
  type: AdamW
  lr: 5.0e-5
  weight_decay: 1.0e-3

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024

model:
  _target_: jepa.JEPA
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: tiny
    patch_size: 14
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: module.ARPredictor
    num_frames: ${history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: module.Embedder
    input_dim: ???
    emb_dim: ${embed_dim}
  projector:
    _target_: module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true

wandb:
  enabled: false
  project: orbit-lewm
