[project]
name = "orbit-maniflow-training"
version = "0.1.0"
description = "Locked CUDA environment for Orbit ManiFlow training and conversion"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==0.34.2",
    "diffusers==0.27.2",
    "dill==0.3.5.1",
    "einops==0.8.1",
    "ftfy==6.3.1",
    "huggingface-hub==0.25.0",
    "hydra-core==1.2.0",
    "numba==0.61.2",
    "numcodecs==0.13.1",
    "numpy==1.24.4",
    "omegaconf==2.2.3",
    "opencv-python==4.5.5.64",
    "pandas==2.0.3",
    "peft==0.15.2",
    "pyarrow==15.0.2",
    "regex==2024.9.11",
    "safetensors==0.4.5",
    "sentencepiece==0.2.0",
    "termcolor==2.5.0",
    "timm==1.0.11",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "tqdm==4.66.5",
    "transformers==4.46.1",
    "wandb==0.18.7",
    "zarr==2.12.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
