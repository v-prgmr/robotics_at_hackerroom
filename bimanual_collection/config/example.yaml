left_robot_port: /dev/ttyACM0
right_robot_port: /dev/ttyACM1
left_leader_port: /dev/ttyACM2
right_leader_port: /dev/ttyACM3

overhead_camera: /dev/video0
left_wrist_camera: /dev/video2
right_wrist_camera: /dev/video4

robot_fps: 60
camera_fps: 30
camera_width: 1280
camera_height: 720
camera_buffer_size: 120
camera_stale_after_s: 0.2
camera_timeout_s: 1.0
communication_timeout_s: 0.25

footswitch:
  enabled: false
  backend: keyboard  # keyboard or evdev
  debounce_s: 0.05
  keyboard:
    left_clutch_key: "1"
    right_clutch_key: "2"
    pause_key: "3"
  evdev:
    device: /dev/input/by-id/usb-your-footswitch-event-kbd
    left_clutch_code: KEY_1
    right_clutch_code: KEY_2
    pause_code: KEY_3

# LeRobot stores one calibration JSON per id under this directory. The
# bimanual-calibrate utility writes the four files used by teleop/recording.
calibration_dir: ./calibration/so100_bimanual
calibration_ids:
  left_follower: left_follower
  right_follower: right_follower
  left_leader: left_leader
  right_leader: right_leader

record: true
output_dir: ./data/bimanual
task_description: "Describe the task for this episode"
warmup_s: 1.0

joint_limits:
  shoulder_pan.pos: [-180.0, 180.0]
  shoulder_lift.pos: [-180.0, 180.0]
  elbow_flex.pos: [-180.0, 180.0]
  wrist_flex.pos: [-180.0, 180.0]
  wrist_roll.pos: [-180.0, 180.0]
  gripper.pos: [0.0, 100.0]

environment:
  table: ""
  lighting: ""
  objects: []

robot_calibration: {}
camera_calibration: {}
